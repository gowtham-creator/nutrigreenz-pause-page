<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutri Greenz Farm — back soon</title>
<meta name="description" content="Nutri Greenz Farm is taking a short break. Cold-pressed oils, A2 bilona ghee and raw honey from our partner farms, back soon.">
<meta name="theme-color" content="#1f4d1f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--leaf-deep:#1f4d1f;--leaf:#2f7a2f;--leaf-bright:#5fb84a;--gold:#b89a5e;--cream:#f7efde;--cream-soft:#fdf8ec;--sky:#e6efd9;--ink:#2a1f12;--ink-soft:#5b4a36}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background:radial-gradient(1000px 600px at 85% -10%,rgba(232,196,104,.32),transparent 60%),
               radial-gradient(800px 560px at -10% 110%,rgba(74,124,42,.2),transparent 65%),
               linear-gradient(180deg,var(--cream-soft),var(--cream) 60%,var(--sky))}
  .card{width:100%;max-width:560px;text-align:center;background:rgba(255,251,240,.6);border:1px solid rgba(255,255,255,.7);
        border-radius:28px;padding:44px 24px 36px;box-shadow:0 30px 60px -20px rgba(58,42,26,.22),0 14px 30px -12px rgba(58,42,26,.14);
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .mark{width:72px;height:72px;margin:0 auto 18px}
  .brand{font-family:Fraunces,serif;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-deep);font-size:20px}
  .tag{font-family:Fraunces,serif;font-style:italic;font-weight:500;color:var(--gold);font-size:13px;margin-top:4px}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,6vw,40px);line-height:1.15;color:var(--leaf-deep);margin:34px 0 14px}
  p{color:var(--ink-soft);font-size:16px;overflow-wrap:anywhere;line-height:1.65;max-width:42ch;margin:0 auto}
  .rule{width:48px;height:2px;background:var(--leaf-bright);opacity:.7;border-radius:2px;margin:28px auto}
  .contact{font-size:14px;color:var(--ink-soft)}
  .contact a{color:var(--leaf);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(47,122,47,.3)}
  .contact a:hover{border-color:var(--leaf)}
  .leaf{display:inline-block;animation:sway 4s ease-in-out infinite;transform-origin:bottom center}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @media (prefers-reduced-motion:reduce){.leaf{animation:none}}
</style>
</head>
<body>
  <main class="card" role="main">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd16a"/><stop offset="1" stop-color="#2f7a2f"/></linearGradient>
        <linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6a2a"/><stop offset="1" stop-color="#1f4d1f"/></linearGradient>
      </defs>
      <rect width="100" height="100" rx="22" fill="#fdf8ec"/>
      <path d="M22 22 L22 78 L32 78 L32 36 L62 78 L72 78 L72 22 L62 22 L62 64 L32 22 Z" fill="url(#n)"/>
      <g class="leaf"><path d="M68 28 C 68 18, 72 12, 76 10" stroke="#2f7a2f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M74 8 C 88 10, 92 22, 84 32 C 74 30, 68 22, 74 8 Z" fill="url(#l)"/></g>
    </svg>
    <div class="brand">Nutri Greenz</div>
    <div class="tag">Born in soil. Built for tomorrow.</div>

    <h1>We're taking a short break.</h1>
    <p>Our store is closed for now. We'll be back soon with the same cold-pressed oils, A2 bilona ghee and raw honey from our partner farms.</p>

    <div class="rule"></div>
    <p class="contact">Questions in the meantime? Write to us at
      <a href="mailto:customersupport@nutrigreenz.farm">customersupport@nutrigreenz.farm</a></p>
  </main>
</body>
</html>
